<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071329" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Ocean Depth Waves -->
  <path d="M12 44 C20 40, 24 48, 32 44 C40 40, 44 48, 52 44" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M12 50 C20 46, 24 54, 32 50 C40 46, 44 54, 52 50" stroke="#0f2b5c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Subsea Tree / Anchor Structure -->
  <circle cx="32" cy="18" r="5" stroke="url(#cyanGrad)" stroke-width="2.5" fill="#0c1f38"/>
  <line x1="32" y1="23" x2="32" y2="42" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="44" y2="28" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Lower Catenary Arc / Flukes -->
  <path d="M18 36 C20 45, 44 45, 46 36" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Telemetry Pulse Beacon -->
  <circle cx="32" cy="18" r="2" fill="#10b981"/>
  <circle cx="48" cy="16" r="3" fill="#38bdf8" opacity="0.9"/>
  <circle cx="48" cy="16" r="6" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
</svg>